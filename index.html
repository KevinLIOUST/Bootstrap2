<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- Pour le Header de la page web -->
    <header>
        <div class="d-inline-block w-100 h-100 bg-primary text-center">
            <h1 class="text-white mb-5 mt-5">
                Dylan Inc.
            </h1>
            <div class="container navbar-toggler bg-primary text-center mb-3 mt-3">
                <ul class="nav">
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Climatisation</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Ventilateur</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Piscine</a>
                    </li>
                </ul>
            </div>
            <!-- <div class="container navbar-toggler text-center mb-3 mt-3 w-auto">
                <nav class="navbar navbar-dark bg-primary">
                    <div class="container-fluid">
                        <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse"

                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon bg-dark"></span>
                        </button>
                    </div>
                </nav>
            </div> -->
        </div>
        <!-- <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav> -->
    </header>

    <!-- Pour le contenu principal de la page -->
    <main class="w-100 h-100">
        <div class="container text-center w-100 h-100 mt-3 mb-3">
            <div class="row d-grid gap-5 d-md-flex">
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/climatiseur.jpg" alt="climatiseur.jpg">
                    </div>
                    <div>
                        <p>Climatiseur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#modal-clim">
                            Plus d'infos
                        </button>
                        <!-- Modal -->
                        <div class="modal fade" id="modal-clim" tabindex="-1" aria-labelledby="modal-clim-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-clim-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est un climatiseur !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/ventilateur.jpg" alt="ventilateur.jpg">
                    </div>
                    <div>
                        <p>Ventilateur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#modal-vent">
                            Plus d'infos
                        </button>
                        <!-- Modal -->
                        <div class="modal fade" id="modal-vent" tabindex="-1" aria-labelledby="modal-vent-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-vent-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est un ventilateur !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/Piscine.jpg" alt="Piscine.jpg">
                    </div>
                    <div>
                        <p>Piscine</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#modal-piscine">
                            Plus d'infos
                        </button>
                        <!-- Modal -->
                        <div class="modal fade" id="modal-piscine" tabindex="-1" aria-labelledby="modal-piscine-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-piscine-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est une piscine !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pour le Footer -->
    <footer class="d-flex w-100 h-100 justify-content-center align-items-center bg-primary">
        <p class="text-white mb-5 mt-5">
            Dylan 2025
        </p>
    </footer>
</body>

</html>
