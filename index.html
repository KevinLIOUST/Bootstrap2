<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- Pour le Header de la page web -->
    <header>

        <!-- Div du Header en Version Desktop -->
        <div class="d-inline-block w-100 h-100 bg-primary text-center">

            <!-- Le gros titre de la page en version desktop -->
            <h1 class="text-white mb-5 mt-5 d-none d-md-block">
                Dylan Inc.
            </h1>

            <!-- Barre de navigation à afficher en version Desktop -->
            <div class="container navbar-toggler bg-primary text-center mb-3 mt-3 d-none d-md-block">
                <ul class="nav">
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Climatisation</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Ventilateur</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Piscine</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Div du Header en version Mobile -->
        <div class="d-inline-block w-100 h-100 bg-primary">
            <ul class="nav">
                <li class="d-flex align-items-center nav-item col">
                    <!-- Menu burger à afficher en version mobile -->
                    <div class="container navbar-toggler text-center mb-3 mt-3 d-sm-none">
                        <nav class="navbar navbar-dark bg-primary">
                            <div class="container-fluid">
                                <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                                    aria-label="Toggle navigation">
                                    <span class="navbar-toggler-icon bg-dark"></span>
                                </button>
                            </div>
                        </nav>
                    </div>
                </li>
                <li class="nav-item col">
                    <!-- Le gros titre de la page enversion mobile -->
                    <h1 class="text-white text-end mb-5 mt-5 mr-5 d-sm-none">
                        Dylan Inc.
                    </h1>
                </li>
            </ul>

            <!-- Barre de navigation à afficher en version mobile en appuyant sur le menu burger -->
            <div class="collapse" id="menu" data-bs-theme="dark">
                <div class="container d-flex justify-content-start navbar-toggler bg-primary mb-3 mt-3 d-sm-none">
                    <ul class="nav d-block text-left">
                        <li class="nav-item col">
                            <a class="nav-link active text-white" href="url">Climatisation</a>
                        </li>
                        <li class="nav-item col">
                            <a class="nav-link active text-white" href="url">Ventilateur</a>
                        </li>
                        <li class="nav-item col">
                            <a class="nav-link active text-white" href="url">Piscine</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- Pour le contenu principal de la page -->
    <main class="w-100 h-100">
        <div class="container text-center mt-3 mb-3">
            <div class="row d-grid gap-5 d-md-flex">

                <!-- Article 1 -->
                <div class="col bg-secondary border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/climatiseur.jpg" alt="climatiseur.jpg">
                    </div>
                    <div>
                        <p class="text-white">Climatiseur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end mt-3 mb-3">
                        <button type="button" class="btn bg-white text-black" data-bs-toggle="modal"
                            data-bs-target="#modal-clim">
                            Plus d'infos
                        </button>

                        <!-- Modal -->
                        <div class="modal fade" id="modal-clim" tabindex="-1" aria-labelledby="modal-clim-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-clim-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est un climatiseur !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Article 2 -->
                <div class="col bg-secondary border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/ventilateur.jpg" alt="ventilateur.jpg">
                    </div>
                    <div>
                        <p class="text-white">Ventilateur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button type="button" class="btn bg-white text-black" data-bs-toggle="modal"
                            data-bs-target="#modal-vent">
                            Plus d'infos
                        </button>

                        <!-- Modal -->
                        <div class="modal fade" id="modal-vent" tabindex="-1" aria-labelledby="modal-vent-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-vent-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est un ventilateur !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Article 3 -->
                <div class="col bg-secondary border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/Piscine.jpg" alt="Piscine.jpg">
                    </div>
                    <div>
                        <p class="text-white">Piscine</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button type="button" class="btn bg-white text-black" data-bs-toggle="modal"
                            data-bs-target="#modal-piscine">
                            Plus d'infos
                        </button>

                        <!-- Modal -->
                        <div class="modal fade" id="modal-piscine" tabindex="-1" aria-labelledby="modal-piscine-Label"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="modal-piscine-Label">Infos</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Ceci est une piscine !
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Fermer</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pour le Footer -->
    <footer class="d-flex w-100 h-100 justify-content-center align-items-center bg-primary">
        <p class="text-white mb-5 mt-5">
            Dylan 2025
        </p>
    </footer>
</body>

</html>
