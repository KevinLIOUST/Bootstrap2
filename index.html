<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <!-- Pour le Header de la page web -->
    <header>
        <div class="d-inline-block w-100 h-100 bg-primary text-center">
            <h1 class="text-white mb-5 mt-5">
                Dylan Inc.
            </h1>
            <div class="container bg-primary text-center mb-3 mt-3">
                <ul class="nav">
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Climatisation</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Ventilateur</a>
                    </li>
                    <li class="nav-item col">
                        <a class="nav-link active text-white" href="url">Piscine</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Pour le contenu principal de la page -->
    <main class="w-100 h-100">
        <div class="container text-center w-100 h-100 mt-3 mb-3">
            <div class="row d-grid gap-5 d-md-flex">
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/climatiseur.jpg" alt="climatiseur.jpg">
                    </div>
                    <div>
                        <p>Climatiseur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button>Plus d'infos</button>
                    </div>
                </div>
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/ventilateur.jpg" alt="ventilateur.jpg">
                    </div>
                    <div>
                        <p>Ventilateur</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button>Plus d'infos</button>
                    </div>
                </div>
                <div class="col border border-black">
                    <div>
                        <img class="w-100 mt-3" src="/img/Piscine.jpg" alt="Piscine.jpg">
                    </div>
                    <div>
                        <p>Piscine</p>
                    </div>
                    <div class="d-flex justify-content-end align-items-end w-100 mt-3 mb-3">
                        <button>Plus d'infos</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pour le Footer -->
    <footer class="d-flex w-100 h-100 justify-content-center align-items-center bg-primary">
        <p class="text-white mb-5 mt-5">
            Dylan 2025
        </p>
    </footer>
</body>

</html>
